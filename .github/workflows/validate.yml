name: validate-toolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check canonical research workflows and recipes
        run: python tools/validate.py
      - name: Verify no-code studio is synchronized with the research source files
        run: python tools/generate_studio_catalog.py --check
      - name: Test project manifest generator and safety checks
        run: python -m unittest discover -s tests -v
      - name: Test the interactive studio and Python/JS job graph parity
        run: node --test tests/test_studio.cjs
